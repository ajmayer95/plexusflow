[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plexusflow"
version = "0.0.1"
description = "Reproducible whole-organ vascular reconstruction from spatially tiled flow microscopy."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Alex Mayer", email = "amayer@flatironinstitute.org" },
]
keywords = ["microscopy", "vasculature", "stitching", "graph", "flow"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy >= 1.24",
  "scipy >= 1.10",
  "networkx >= 3.0",
  "scikit-image >= 0.21",
  "tifffile >= 2023.7",
  "pydantic >= 2.5",
  "pyyaml >= 6.0",
  "typer >= 0.9",
  "opencv-python-headless >= 4.8",
  "joblib >= 1.3",
  "matplotlib >= 3.7",
  "imageio >= 2.30",
  "h5py >= 3.8",
]

[project.optional-dependencies]
gui = ["napari[all] >= 0.5"]                 # napari[all] brings the Qt binding it supports
sam2 = ["torch", "torchvision"]
ilastik = ["h5py"]
# mask → graph vectorisation (plexusflow mve / vectorize)
vectorize = ["net3 @ git+https://github.com/ajmayer95/net3.git"]
# everything the paper figure scripts need (scripts/make_figure*.py; see FIGURES.md)
figures = ["shapely >= 2.0"]
# known-truth benchmark (scripts/benchmark/): scikit-fem + numba to run; gmsh + meshio only to rebuild geometry
bench = ["scikit-fem >= 10", "numba >= 0.58", "meshio >= 5", "gmsh >= 4.11", "pykitPIV"]
dev = [
  "pytest >= 7.4",
  "pytest-cov",
  "ruff >= 0.4",
  "mypy >= 1.7",
]

[tool.hatch.metadata]
allow-direct-references = true            # net3 is installed from GitHub

[project.scripts]
plexusflow = "plexusflow.cli:app"
plexusmech = "plexusmech.cli:app"

[project.urls]
Homepage = "https://github.com/ajmayer95/plexusflow"
Documentation = "https://github.com/ajmayer95/plexusflow"
Issues = "https://github.com/ajmayer95/plexusflow/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/plexusflow", "src/plexusmech"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# The codebase uses a deliberately compact style (several short statements per line, one-line
# `except X: pass`, inline imports) and ports large legacy modules; CI enforces correctness, not style.
ignore = [
    "E501",          # line length
    "E401", "E402",  # import layout
    "E701", "E702",  # multiple statements per line
    "E731", "E741",  # lambda assignment, short names (l, I) in numeric code
    "B007",          # unused loop variable
    "B008",          # call in default argument
    "B905",          # zip() without strict=
    "B023",          # loop variable in closure — every current case is called within the iteration (reviewed 2026-10-15)
    "F401", "F841",  # unused imports / variables in ported legacy modules
]

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
